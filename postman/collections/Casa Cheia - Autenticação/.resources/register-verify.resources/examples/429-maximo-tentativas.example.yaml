$kind: http-example
name: 429 — máximo de tentativas
request:
  method: POST
  url: '{{base_url}}/register/verify'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "telefone": "923456789",
        "code": "000000"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "status": false,
        "message": "Número máximo de tentativas excedido. Por favor, registe-se novamente."
      }
order: 3000
